name: cpu-ci

on:
  push:
  pull_request:

jobs:
  unit-fast:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Unit and contract tests
        run: >-
          python -m pytest -q
          --ignore=tests/test_assignment_method_production_matrix.py
          --junitxml=junit-unit-${{ matrix.python-version }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-fast-${{ matrix.python-version }}
          path: junit-unit-${{ matrix.python-version }}.xml

  recourse-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: End-to-end recourse learner smokes
        run: make smoke-recourse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recourse-contract-artifacts
          path: |
            results/**
            logs/**
          if-no-files-found: ignore

  assignment-production-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Canonical checkpoint train/reload/evaluate matrix
        run: >-
          python -m pytest -q tests/test_assignment_method_production_matrix.py
          --junitxml=junit-assignment-production.xml
      - name: Production runner dry-run
        run: make assignment-matrix-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment-production-artifacts
          path: |
            junit-assignment-production.xml
            results/**
            logs/**
          if-no-files-found: ignore

  synthetic-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: make smoke-toy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-smoke-artifacts
          path: |
            results/**
            logs/**
          if-no-files-found: ignore

  nyc-sample-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: make smoke-nyc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nyc-sample-smoke-artifacts
          path: |
            results/**
            logs/**
          if-no-files-found: ignore
